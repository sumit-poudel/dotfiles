# =============================================================================
# 1. CORE SHELL & INTERFACE THEME & PLUGINS	
# =============================================================================

[theme]
community_palette = "Gruvbox Material Hard"
source = "community"

[theme.templates]
builtin_ids = [
  "btop",
  "cava",
  "foot",
  "gtk3",
  "gtk4",
  "kitty",
  "niri",
  "qt",
]

community_ids = [
    "zen-browser",
    "neovim",
    "obsidian",
    "vscode",
    "zed",
    "steam",
    "fastfetch",
    "obs",
    "zathura",
    "papirus-icons",
    "bat",
    "fzf",
    "herdr",
    "tmux",
    "yazi"
]

[plugins]
enabled = [
  "cleboost/zed-provider",
  "cleboost/jetbrains-provider",
  "nightwatch75/file-search",
  "dunarand/tmux-provider",
]
