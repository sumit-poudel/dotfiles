[[bar.mini.capsule_group]]
id = "windows"
accordion = false
members = ["workspaces", "colon", "active_window"]
foreground = "on_primary"
enabled = true
fill = "primary"

[[bar.mini.capsule_group]]
accordion = true
fill = "primary"
foreground = "on_primary"
id = "clk"
members = ["clock", "clock-date"]

[[bar.mini.capsule_group]]
id = "uname"
members = ["topCorner", "hostname", "temp", "bottomCorner"]
widget_spacing = 7
padding = 0
enabled = true
opacity = 0.0

[[bar.mini.capsule_group]]
id = "sys"
members = ["battery", "cpu", "ram"]
widget_spacing = 15
enabled = true
opacity = 0.0

[widget.workspaces]
style = "minimal"
focused_color = "on_primary"
hide_when_empty = true
occupied_color = "on_surface"
show_icons = false

[widget.active_window]
display = "text_only"
min_length = 10
max_length = 150

[widget.audio-vis]
type = "audio_visualizer"
width = 200
bands = 16
centered = true
show_when_idle = true
color_1 = "primary"
color_2 = "secondary"

[widget.audio-vis.actions]
left = "panel-toggle control-center media"
right = "media toggle"

[widget.temp]
type = "sysmon"
stat = "cpu_temp"
show_glyph = false
visualization = "none"
color = "on_surface"

[widget.cpu]
type = "sysmon"
stat = "cpu_usage"
show_glyph = true
visualization = "none"
color = "on_surface"

[widget.ram]
type = "sysmon"
stat = "ram_used"
show_glyph = true
visualization = "none"
color = "on_surface"

[widget.brightness]
show_label = false

[widget.volume]
type = "volume"
show_label = false

[widget.bluetooth]
show_label = false

[widget.network]
show_label = false

[widget.clock]
format = "{:%I:%M %A}"

[widget.clock-date]
type = "clock"
format = "{:%d %b %Y}"

[widget.hostname]
type = "text"
text = "MEOW"
color = "primary"

[widget.bar]
type = "text"
text = "|"

[widget.topCorner]
type = "text"
scale = 1.5
text = "˹"

[widget.bottomCorner]
type = "text"
scale = 1.5
text = "˼"
