[[bar.mini.capsule_group]]
id      = "g1"
members = ["clock", "network", "bluetooth", "volume"]
fill    = "surface"
enabled = true
accordion = true                         # optional: collapse to the first widget, reveal on hover
accordion_direction = "start"              # "end" (default) or "start"

[widget.workspaces]
style = "focus_hint"

[widget.battery]
display_mode = "graphic"
show_label = false

[widget.cat]
type = "dotnetrob/cat:cat"


[widget.cpu]
display = "text"

[widget.temp]
display = "text"
visualization = "none"

[widget.ram]
display = "text"
visualization = "none"
stat = "ram_pct"

[widget.clock]
color = "primary"
format = "| {:%I:%M  %d:%a}"
tooltip_format = "{:%A, %B %d, %Y}"

[widget.launcher]
glyph = "pacman"
color = "primary"

[widget.media]
min_length = 150

[widget.network]
show_label = false

[widget.volume]
show_label = false

[widget.notifications]
color = "primary"

[widget.spacer_2]
type = "spacer"
