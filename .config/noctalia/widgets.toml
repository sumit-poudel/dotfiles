[[bar.mini.capsule_group]]
accordion = false
accordion_direction = "end"
border_width = 1.0
enabled = true
fill = "primary"
foreground = "on_primary"
id = "windows"
members = ["workspaces", "colon", "active_window"]
opacity = 1.0
padding = 6.0

[[bar.mini.capsule_group]]
accordion = true
accordion_direction = "end"
border_width = 1.0
enabled = true
fill = "primary"
foreground = "on_primary"
id = "clk"
members = ["clock", "clock-date"]
opacity = 1.0
padding = 6.0

[[bar.mini.capsule_group]]
accordion = false
accordion_direction = "end"
border_width = 1.0
enabled = true
fill = "surface_container"
id = "uname"
members = ["hostname", "temp"]
opacity = 0.0
padding = 0.0
widget_spacing = 7

[[bar.mini.capsule_group]]
accordion = false
accordion_direction = "end"
border_width = 1.0
enabled = true
fill = "surface_container"
id = "sys"
members = ["cpu", "ram"]
opacity = 0.0
padding = 6.0
widget_spacing = 17

[[bar.mini.capsule_group]]
accordion = false
accordion_direction = "end"
enabled = true
fill = "surface_container"
id = "controls"
members = [
  "bar",
  "brightness",
  "bar",
  "volume",
  "bar",
  "network",
  "bar",
  "bluetooth",
  "bar",
]
opacity = 0.0
padding = 6.0
widget_spacing = 7


[widget.workspaces]
style = "minimal"
focused_color = "on_primary"
hide_when_empty = true
occupied_color = "on_surface"
show_icons = false

[widget.active_window]
display = "text_only"
min_length = 10
max_length = 150

[widget.audio-vis]
type = "audio_visualizer"
width = 150
bands = 10
mirrored = false
centered = false
show_when_idle = true
color_1 = "primary"

[widget.audio-vis.actions]
left = "panel-toggle control-center media"
right = "media toggle"

[widget.temp]
type = "sysmon"
stat = "cpu_temp"
show_glyph = false
visualization = "none"

[widget.cpu]
type = "sysmon"
# stat = "cpu_used"
show_glyph = false
custom_label = "cpu"
visualization = "none"
color = "secondary"

[widget.battery]
type = "battery"
device = "auto"
scale = 0.75
display_mode = "graphic"

[widget.ram]
type = "sysmon"
stat = "ram_used"
show_glyph = false
custom_label = "mem"
label_show_units = false
visualization = "none"
color = "secondary"

[widget.brightness]
show_label = false

[widget.volume]
type = "volume"
show_label = false

[widget.bluetooth]
show_label = false

[widget.network]
show_label = false

[widget.clock]
format = "{:%I:%M %A}"

[widget.clock-date]
type = "clock"
format = "{:%d %b %Y}"

[widget.hostname]
type = "text"
text = "MEOW"
color = "primary"

[widget.bar]
type = "text"
text = "|"

[widget.topCorner]
type = "text"
scale = 1.5
text = "˹"

[widget.bottomCorner]
type = "text"
scale = 1.5
text = "˼"
