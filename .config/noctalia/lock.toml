[lockscreen]
fingerprint = false
blur_intensity = 0.50
tint_intensity = 0.50

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
    "lockscreen-widget-eDPclock",
    "lockscreen-widget-eDPdate",
    "lockscreen-widget-eDPweather",
    "lockscreen-widget-eDPplayer",
    "lockscreen-login-box@eDP-1",
    "lockscreen-widget-HDMIclock",
    "lockscreen-widget-HDMIdate",
    "lockscreen-widget-HDMIweather",
    "lockscreen-widget-HDMIplayer",
    "lockscreen-login-box@HDMI-A-1",
]

[lockscreen_widgets.grid]
cell_size = 16
major_interval = 4
visible = true

# =========================
# eDP-1 — 1536 x 864
# =========================

[lockscreen_widgets.widget."lockscreen-widget-eDPclock"]
box_height = 224.0
box_width = 432.0
cx = 280.0
cy = 160.0
output = "eDP-1"
placement_height = 864.0
placement_width = 1536.0
rotation = 0.0
type = "clock"

[lockscreen_widgets.widget."lockscreen-widget-eDPclock".settings]
background = false
font_family = ""
format = "{:%H:%M}"
shadow = false

[lockscreen_widgets.widget."lockscreen-widget-eDPdate"]
box_height = 80.0
box_width = 432.0
cx = 280.0
cy = 288.0
output = "eDP-1"
placement_height = 864.0
placement_width = 1536.0
rotation = 0.0
type = "clock"

[lockscreen_widgets.widget."lockscreen-widget-eDPdate".settings]
background = false
font_family = ""
format = "{:%A,%d %b %Y}"
shadow = false

[lockscreen_widgets.widget."lockscreen-widget-eDPweather"]
box_height = 128.0
box_width = 192.0
cx = 408.0
cy = 376.0
output = "eDP-1"
placement_height = 864.0
placement_width = 1536.0
rotation = 0.0
type = "weather"

[lockscreen_widgets.widget."lockscreen-widget-eDPweather".settings]
background = false
shadow = false

[lockscreen_widgets.widget."lockscreen-widget-eDPplayer"]
box_height = 144.0
box_width = 400.0
cx = 1272.0
cy = 672.0
output = "eDP-1"
placement_height = 864.0
placement_width = 1536.0
rotation = 0.0
type = "media_player"

[lockscreen_widgets.widget."lockscreen-widget-eDPplayer".settings]
background = false
hide_when_no_media = false
shadow = false

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
box_height = 70.0
box_width = 416.0
cx = 1280.0
cy = 797.0
output = "eDP-1"
placement_height = 864.0
placement_width = 1536.0
rotation = 0.0
type = "login_box"

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
background_color = "surface_container"
background_opacity = 0.0
background_radius = 12.0
center_password_text = true
input_opacity = 1.0
input_radius = 6.0
layout = "compact"
show_caps_lock = false
show_keyboard_layout = false
show_login_button = false
show_media = true
show_session_buttons = true
show_unlock_hint = false
show_weather = true

