# =============================================================================
# CORE SHELL
# =============================================================================

[wallpaper]
directory = "/home/sumit/Pictures/Wallpapers"

[backdrop]
enabled = true

[shell]
corner_radius_scale = 0.0
avatar_path = "/home/sumit/Pictures/avtar.jpg"
clipboard_history_max_entries = 40
font_family = "Ioskeley Mono"
password_style = "random"
settings_show_advanced = true
telemetry_enabled = false
time_format = "{:%H:%M %a}"
polkit_agent = true
button_borders = false
card_borders = false
input_borders = false
popup_borders = false
popup_shadows = false
launch_apps_as_systemd_services = true

[shell.panel]
launcher_placement = "floating"       # attached | floating | centered
launcher_position = "center"
control_center_placement = "floating"
clipboard_placement = "floating"
clipboard_position = "auto"
polkit_placement = "floating"
polkit_position = "auto"
transparency_mode = "solid"
shadow = false
border_color = "primary"
border_width = 3.0


[accessibility]
ui_scale = 1.0

[shell.launcher]
categories = false
layout = "simple"
compact = true
show_icons = false
fetch_exchange_rates = false

[shell.window_switcher]
style = "compact"
show_app_icon = false

[[shell.session.actions]]
action = "shutdown"
enabled = true
shortcut = "1"
variant = "destructive"

[[shell.session.actions]]
action = "reboot"
enabled = true
shortcut = "2"
variant = "default"

[[shell.session.actions]]
action = "logout"
enabled = true
shortcut = "3"
variant = "default"

[[shell.session.actions]]
action = "lock"
enabled = true
shortcut = "4"
variant = "default"

[[shell.session.actions]]
action = "lock_and_suspend"
enabled = true
shortcut = "5"
variant = "default"

[battery]
warning_threshold = 50

[notification]
enable_daemon = true
layer = "overlay"
position = "top_right"

[osd]
position = "top_left"
orientation = "vertical"
position_vertical = "top_right"
border = false

[osd.kinds]
media = false

[system.monitor]
cpu_temp_activity_threshold = 75
cpu_temp_critical_threshold = 95

[brightness]
enable_ddcutil = true

[control_center]
sidebar_section = "full"

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "caffeine"

[[control_center.shortcuts]]
type = "nightlight"

[[control_center.shortcuts]]
type = "notification"

[[control_center.shortcuts]]
type = "power_profile"

[idle]
behavior_order = ["lock", "screen-off", "lock-and-suspend"]

[idle.behavior.lock]
action = "lock"
enabled = true
timeout = 300

[idle.behavior.lock-and-suspend]
action = "lock_and_suspend"
enabled = true
timeout = 900

[idle.behavior.screen-off]
action = "screen_off"
enabled = true
timeout = 330

[keybinds]
cancel = ["Escape"]
down = ["Ctrl+n"]
left = ["Ctrl+h"]
right = ["Ctrl+l"]
up = ["Ctrl+p"]

[location]
address = "chitwan,Nepal"

[nightlight]
enabled = true

[calendar]
enabled = true
event_time_format = "{:%-I:%M %p}"

[calendar.account.001_google]
name = "001"
type = "google"

[calendar.account.me_google]
name = "me"
type = "google"
